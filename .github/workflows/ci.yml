# Checks every push: unit tests, then a fast low-resolution render of the
# demo story with automatic verification of the MP4 (plays, in sync, etc).
name: Test pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm test
      - name: Render demo (720p) and verify
        run: node render/cli.js --demo --res 720p --fps 30 --out output/ci-demo.mp4 --workers 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-demo
          path: |
            output/ci-demo.mp4
            output/ci-demo.report.json
